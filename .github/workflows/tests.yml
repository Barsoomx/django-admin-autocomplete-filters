name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality (Ruff, Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tools (ruff, mypy, stubs)
        run: pip install .[dev] mypy
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy admin_auto_filters

  test:
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
        exclude:
          - { python-version: "3.13", django: "4.2" }
          - { python-version: "3.14", django: "4.2" }
          - { python-version: "3.13", django: "5.0" }
          - { python-version: "3.14", django: "5.0" }
          - { python-version: "3.14", django: "5.1" }
          - { python-version: "3.10", django: "6.0" }
          - { python-version: "3.11", django: "6.0" }
          - { python-version: "3.10", django: "6.1" }
          - { python-version: "3.11", django: "6.1" }
        include:
          # Keep the descriptor behavior discussed in #25 covered after newer 6.0 releases.
          - { python-version: "3.12", django: "6.0.5" }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and selected Django series
        run: python -m pip install -e . "Django==${{ matrix.django }}.*"
      - name: Show Django version
        run: python -m django --version
      - name: Run tests
        run: python ./tests_manage.py test tests -v 2
